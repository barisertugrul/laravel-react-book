; /etc/supervisor/conf.d/anahtarci.conf
; Anahtarcı'da uzun süre çalışan tek süreç kuyruk işçisi (IssueLicense: ödeme
; webhook'undan sonra lisans anahtarını üretir). Reverb ve zamanlayıcı yok.

[program:anahtarci-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/anahtarci/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/anahtarci/shared/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
