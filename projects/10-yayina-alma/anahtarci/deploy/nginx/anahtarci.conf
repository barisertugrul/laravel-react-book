# /etc/nginx/sites-available/anahtarci
server {
    listen 80;
    listen [::]:80;
    server_name lisans.localhost;

    # Belge kökü YALNIZCA public/: .env, storage/, vendor/ dışarıdan erişilemez
    root /var/www/anahtarci/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 2M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Derlenmiş dosyaların adında içerik özeti var (app-BWiUWYza.js): uzun süre önbelleğe alınabilir
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }


    location ~ \.php$ {
        fastcgi_pass unix:/run/php/anahtarci.sock;
        include fastcgi_params;
        # $realpath_root: current symlink'i çözülmüş gerçek yol (releases/2026...).
        # $document_root kullanılırsa opcache dağıtımdan sonra eski sürümün dosyalarını çalıştırabilir.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # .env, .git, .htaccess gibi nokta ile başlayan her şey (Let's Encrypt'in .well-known'ı hariç)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/anahtarci.access.log;
    error_log  /var/log/nginx/anahtarci.error.log;
}
