; /etc/php/8.5/fpm/pool.d/kumanda.conf
; Siteye özel PHP-FPM havuzu: PHP, dağıtımı yapan ve kuyruğu çalıştıran kullanıcıyla
; (deploy) aynı kimlikle çalışır. Böylece storage/ altındaki dosyalarda izin çakışması olmaz.
[kumanda]
user = deploy
group = deploy

; Nginx (www-data) bu sokete bağlanabilir, başkası bağlanamaz
listen = /run/php/kumanda.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Küçük bir sunucu için: en fazla 10 eşzamanlı PHP isteği
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Paket kütüphanesine eklenti zip'i yüklenebilsin (Bölüm 9)
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 21M
