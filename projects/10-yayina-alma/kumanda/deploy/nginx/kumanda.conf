# /etc/nginx/sites-available/kumanda
server {
    listen 80;
    listen [::]:80;
    server_name kumanda.localhost;

    # Belge kökü YALNIZCA public/: .env, storage/, vendor/ dışarıdan erişilemez
    root /var/www/kumanda/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 21M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Derlenmiş dosyaların adında içerik özeti var (app-BWiUWYza.js): uzun süre önbelleğe alınabilir
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Reverb (canlı ilerleme): /app = tarayıcının WebSocket'i, /apps = Laravel'in olay gönderdiği HTTP API
    location ~ ^/apps?/ {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/kumanda.sock;
        include fastcgi_params;
        # $realpath_root: current symlink'i çözülmüş gerçek yol (releases/2026...).
        # $document_root kullanılırsa opcache dağıtımdan sonra eski sürümün dosyalarını çalıştırabilir.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # .env, .git, .htaccess gibi nokta ile başlayan her şey (Let's Encrypt'in .well-known'ı hariç)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/kumanda.access.log;
    error_log  /var/log/nginx/kumanda.error.log;
}
