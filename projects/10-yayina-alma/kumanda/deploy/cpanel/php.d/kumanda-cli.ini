; YALNIZCA cron'daki CLI süreçleri için: PHP_INI_SCAN_DIR ile yüklenir, web tarafını etkilemez.
; Bu hosting CLI'da proc_open, exec, symlink... fonksiyonlarını kapatıyor; Laravel zamanlayıcısı
; görevleri alt süreç olarak başlatır, yedekleme mysqldump'ı proc_open ile çağırır.
; -d disable_functions= yalnızca o süreci etkiler; ortam değişkeni ise alt süreçlere de geçer.
disable_functions = ""
