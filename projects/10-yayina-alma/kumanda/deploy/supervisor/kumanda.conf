; /etc/supervisor/conf.d/kumanda.conf
; Supervisor süreçleri ayakta tutar: çökerse ya da queue:restart / reverb:restart ile
; kibarca kapanırsa yeniden başlatır (yeni current klasöründen, yani yeni kodla).

[program:kumanda-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/kumanda/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=deploy
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Çalışan bir işin bitmesi için süre tanı (en uzun işten uzun olmalı)
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/www/kumanda/shared/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:kumanda-reverb]
command=/usr/bin/php /var/www/kumanda/current/artisan reverb:start
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/kumanda/shared/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Her açık WebSocket bir dosya tanıtıcısı kullanır
minfds=10000

; Pulse'un "Sunucular" kartı: CPU, bellek ve disk kullanımını 15 saniyede bir kaydeder
[program:kumanda-pulse]
command=/usr/bin/php /var/www/kumanda/current/artisan pulse:check
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/kumanda/shared/storage/logs/pulse.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
