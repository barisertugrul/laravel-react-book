; /etc/supervisor/conf.d/uygulama.conf
; Supervisor süreçleri ayakta tutar: çökerse ya da queue:restart / pulse:restart ile
; kibarca kapanırsa yeniden başlatır (yeni current klasöründen, yani yeni kodla).

[program:uygulama-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/uygulama/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Çalışan bir işin bitmesi için süre tanı (en uzun işten uzun olmalı)
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/uygulama/shared/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Pulse'un "Sunucular" kartı: CPU, bellek ve disk kullanımını 15 saniyede bir kaydeder
[program:uygulama-pulse]
command=/usr/bin/php /var/www/uygulama/current/artisan pulse:check
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/uygulama/shared/storage/logs/pulse.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
